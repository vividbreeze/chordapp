version: '3.8'

services:
  chordapp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chordapp
    restart: unless-stopped
    ports:
      - "8008:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: Add traefik labels for reverse proxy
# labels:
#   - "traefik.enable=true"
#   - "traefik.http.routers.chordapp.rule=Host(`chordapp.yourdomain.com`)"
#   - "traefik.http.routers.chordapp.entrypoints=websecure"
#   - "traefik.http.routers.chordapp.tls.certresolver=letsencrypt"
